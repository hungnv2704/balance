services:
  postgres:
    image: postgres:16-alpine
    container_name: pfm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pfm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pfm_local_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-pfm_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pfm_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pfm_user} -d ${POSTGRES_DB:-pfm_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pfm_pgdata:
